name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: slideforge-$TAG-x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: slideforge-$TAG-aarch64-linux.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: slideforge-$TAG-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: slideforge-$TAG-aarch64-macos.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: slideforge-$TAG-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCHIVE=${ARCHIVE/\$TAG/$VERSION}
          mkdir -p dist
          cp "target/$TARGET/release/slideforge" dist/
          cp README.md LICENSE* dist/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C dist .
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $archive = $env:ARCHIVE.Replace('$TAG', $version)
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$($env:TARGET)/release/slideforge.exe" dist/
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE-MIT) { Copy-Item LICENSE-MIT dist/ }
          if (Test-Path LICENSE-APACHE) { Copy-Item LICENSE-APACHE dist/ }
          Compress-Archive -Path dist/* -DestinationPath $archive
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
