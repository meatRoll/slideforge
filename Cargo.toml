[package]
name = "slideforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Edit and build PPTX presentations from the PPTD language"
license = "MIT OR Apache-2.0"
keywords = ["pptx", "pptd", "presentation", "ooxml", "slides"]
categories = ["command-line-utilities", "encoding"]
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# XML is emitted through the small hand-rolled builder in `pptx::xml`; if the
# slide renderer grows rich-text run splitting, quick-xml may be worth adding.
# zip = ... (active above)

[profile.release]
lto = "thin"
strip = true